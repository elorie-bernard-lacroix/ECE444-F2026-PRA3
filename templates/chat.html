{% extends "base.html" %}

{% block title %}Flasky - Chat{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Hello, {{ name }}.</h1>
    <h2>Your UofT Email is {{ email }}</h2>
</div>

<div id="chat-messages" class="well" aria-live="polite">
    <p><strong>Bot:</strong> Hello! Tell me something to remember.</p>
</div>

<div class="form-inline">
    <label class="sr-only" for="message">Message</label>
    <input id="message" class="form-control" type="text" placeholder="Type a message" autocomplete="off">
    <button id="send" class="btn btn-primary" type="button">Send</button>
</div>

<p><a class="btn btn-default" href="{{ url_for('logout') }}">Log out</a></p>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    const messageInput = document.getElementById('message');
    const messages = document.getElementById('chat-messages');

    function addMessage(sender, text) {
        const paragraph = document.createElement('p');
        const label = document.createElement('strong');
        label.textContent = sender + ': ';
        paragraph.appendChild(label);
        paragraph.appendChild(document.createTextNode(text));
        messages.appendChild(paragraph);
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) {
            return;
        }

        addMessage('You', message);
        messageInput.value = '';
        const response = await fetch('{{ url_for("chat") }}', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: message})
        });
        const data = await response.json();
        addMessage('Bot', data.reply);
    }

    document.getElementById('send').addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });
</script>
{% endblock %}
